<!DOCTYPE html>
<html lang ="en">
    <head>
        <meta charset ="UTF-8">
        <meta name ="viewport" content=" "width=device-width,initial scale="1.0">

        <title> College Event Tracker </title>
        <link rel = "stylesheet" href ="style.css">

    </head>
    <body>
        <header>
            <h1> College Event Tracker</h1>
            <p> Discover and register for college events </p>
        </header>
        <!---CREATE EVENT-->
        <section class = "create-section" >
            <h2> Create an event </h2>
            <input id="title" type ="text" placeholder ="Event title">
            <input id="club" type ="text" placeholder = "Club name">
            <input id="date" type ="date">
            <input id="venue" type ="text" placeholder ="venue">
            <input id="description" type ="text" placeholder ="Description">
            <button onclick ="submitEvent()">
                create Event
            </button>
            <p id="message"></p>
        </section>

        <section>
            <h2> Upcoming events</h2>
            <div id="events">
                loading events...
            </div>

        </section>
        <script src ="script.js"></script>

    </body>
</html>
